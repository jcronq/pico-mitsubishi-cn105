; PlatformIO Project Configuration File
;
; Target: Raspberry Pi Pico W (RP2040 + CYW43439)
; Framework: Arduino (earlephilhower arduino-pico core)

[env:pico_w]
; Pinned to an exact commit so a rebuild reproduces this firmware. This commit
; pins framework-arduinopico to earlephilhower/arduino-pico@fd65f6d4
; (ARDUINO_PICO_VERSION_STR 6.1.0), which is what the working firmware was
; built against. Without the #sha, PlatformIO tracks the fork's develop HEAD
; and a fresh install may resolve a different core.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = rpipicow
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m

upload_protocol = picotool

monitor_speed = 115200
monitor_filters = default, time

build_flags =
  -DARDUINO_RASPBERRY_PI_PICO_W
  -DWIFI_IS_OFF_AT_BOOT

; Exact versions, not ranges. handleCommand() depends on documented-by-reading
; internals of both: HeatPump's single-step sync() and INFOMODE rotation, and
; ArduinoJson's promotion of mixed int/float variant compares to double.
lib_deps =
  swicago/HeatPump@1.0.0
  bblanchon/ArduinoJson@7.4.3
